version: "3.9"

services:
  bot-downloader:
    build: .
    container_name: bot-downloader
    restart: unless-stopped
    # Tanpa `ports:` — akses hanya lewat network internal (cloudflared tunnel
    # ke http://bot-downloader:8000). Tidak ada port yang dipublish ke host.
    env_file:
      - .env
    environment:
      # Override path agar sesuai mount volume di container
      # (.env lokal pakai path Windows seperti ./downloads).
      DOWNLOAD_DIR: /tmp/downloads
      LOGS_DIR: /app/logs
    volumes:
      - ./downloads:/tmp/downloads
      - ./logs:/app/logs
    networks:
      - app-network

# Join ke network yang sudah dipakai service mysql + cloudflared.
# Pastikan network ini sudah ada (dibuat oleh stack mysql).
networks:
  app-network:
    name: app-network
    external: true
