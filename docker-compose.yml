version: "3.9"

services:
  bot-downloader:
    build: .
    container_name: bot-downloader
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./downloads:/tmp/downloads
      - ./logs:/app/logs
    networks:
      - app-network

# Join ke network yang sudah dipakai service mysql + cloudflared.
# Pastikan network ini sudah ada (dibuat oleh stack mysql).
networks:
  app-network:
    name: app-network
    external: true
